remote_theme: yousinix/portfolYOU

title: Sam Molugu
description: Backend Engineer building distributed systems for FinTech and healthcare — now shipping full-stack products independently.
url: "https://sammolugu.github.io"

author:
  name: Sam Molugu
  email: sadruth@gmail.com
  github: SamMolugu
  linkedin: sam-molugu

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

paginate: 6
paginate_path: "/blog/page:num/"
permalink: /:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

collections:
  projects:
    output: true
    permalink: /projects/:name/

exclude:
  - docs/
  - test/
  - portfolyou-jekyll-theme.gemspec
  - project_upholstery.ps1
  - Gemfile
  - README.md