remote_theme: yousinix/portfolYOU

title: Sam Molugu
description: Java Backend Engineer · Distributed Systems · FinTech & Healthcare
url: "https://sammolugu.github.io"

author:
  name: Sam Molugu
  email: sadruth@gmail.com
  github: SamMolugu
  linkedin: sam-molugu

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

paginate: 6
paginate_path: "/blog/page:num/"

permalink: /:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

collections:
  projects:
    output: true
    permalink: /projects/:name/